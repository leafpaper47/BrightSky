name: Deploy BrightSky to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 纯静态站点：直接把 web/ 发出去，无需 Node 构建
      - name: Sanity check data
        run: |
          test -f web/index.html
          test -f web/data.json
          test -f web/app.js
          python3 -c "import json;d=json.load(open('web/data.json',encoding='utf-8'));print('enchants:',d['meta']['total'])"

      - name: Disable Jekyll processing
        run: touch web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
